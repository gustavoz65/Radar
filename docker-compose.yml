name: omnia

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnia-postgres
    environment:
      POSTGRES_DB: omnia
      POSTGRES_USER: omnia_owner
      POSTGRES_PASSWORD: omnia_local_dev
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    ports:
      # 5433 no host: máquinas de dev costumam ter um PostgreSQL local ocupando a 5432
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnia_owner -d omnia']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omnia-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: omnia-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web

  sonarqube:
    image: sonarqube:community
    container_name: omnia-sonarqube
    profiles: ['quality'] # opcional: make sonar-up
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
  postgres-data:
  sonarqube-data:
